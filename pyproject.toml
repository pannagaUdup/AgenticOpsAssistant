[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[project]
name = "agenticopsassistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
]
