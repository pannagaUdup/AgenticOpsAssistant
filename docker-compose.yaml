services:
  postgres:
    image: postgres:16
    container_name: agenticops-postgres
    environment:
      POSTGRES_DB: agenticops
      POSTGRES_USER: agenticops
      POSTGRES_PASSWORD: agenticops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - agenticops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticops -d agenticops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agenticops_postgres_data: